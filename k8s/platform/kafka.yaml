# =====================================================================
#  Kafka partagé par les environnements dev, recette et prod (namespace banque-kafka).
#  Un seul broker en mode KRaft (sans Zookeeper), comme dans docker-compose.yml.
#  Appliqué automatiquement par la CD (kubectl apply -f k8s/platform/).
#  ⚠️ Pour apprendre : les 3 environnements partagent les mêmes topics.
#  Tâche S8-3 : remplacer par l'opérateur Strimzi (un cluster Kafka par environnement).
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: banque-kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: banque-kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Sinon Kubernetes injecte KAFKA_PORT=tcp://..., que l'image Kafka prend pour un réglage
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000            # l'image tourne avec l'utilisateur 1000 : il doit pouvoir écrire sur le disque
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.banque-kafka.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            - name: KAFKA_HEAP_OPTS
              value: "-Xms384m -Xmx384m"
          resources:
            requests: { cpu: 100m, memory: 640Mi }
            limits:   { memory: 768Mi }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: banque-kafka
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
